<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa</title>
<style>
  :root { --bg:#fff8f0; --card:#fff; --text:#2b2b2b; --muted:#777; --red:#c62828; --green:#2e7d32; --border:#eadfd2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1a18; --card:#2a2623; --text:#f2ece6; --muted:#a99f95; --border:#403934; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:24px 16px 60px; }
  h1 { text-align:center; color:var(--red); margin-bottom:4px; }
  .sub { text-align:center; color:var(--muted); margin-top:0; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  input, select { font:inherit; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); min-width:0; }
  input { flex:1; }
  select { flex:1; }
  button { font:inherit; padding:10px 14px; border:0; border-radius:8px; cursor:pointer; background:var(--red); color:#fff; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
  button.big { width:100%; padding:14px; font-size:1.05rem; margin-top:12px; }
  .del { padding:10px; }
  .error { color:var(--red); margin-top:10px; }
  .link-row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .link-row:last-child { border-bottom:0; }
  .reveal { text-align:center; padding:40px 16px; }
  .gift { font-size:4rem; }
  .target { font-size:2.2rem; font-weight:700; color:var(--green); margin:16px 0; }
  .hidden { display:none; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🎅 Secret Santa</h1>

  <!-- Vue organisateur -->
  <div id="setup">
    <p class="sub">Ajoute les participants et choisis le/la partenaire des couples.</p>
    <div class="card">
      <div id="people"></div>
      <button class="secondary" id="add">+ Ajouter une personne</button>
      <button class="big" id="draw">🎲 Lancer le tirage</button>
      <div class="error" id="error"></div>
    </div>
  </div>

  <div id="results" class="hidden">
    <p class="sub">Tirage fait ! Envoie à chacun son lien <b>privé</b>.<br>Ne regarde pas les résultats, garde la surprise 😉</p>
    <div class="card" id="links"></div>
    <div class="card">
      <button class="big" id="phone" style="margin-top:0">📱 Mode « on se passe le téléphone »</button>
      <small>Chacun découvre son résultat à tour de rôle, sur cet écran.</small>
    </div>
    <div class="card">
      <button class="secondary" id="copyall" style="width:100%">Copier tous les messages (à découper)</button>
      <button class="secondary" id="back" style="width:100%;margin-top:8px">↩ Recommencer</button>
    </div>
  </div>

  <!-- Mode téléphone qui passe -->
  <div id="pass" class="hidden card reveal">
    <div class="gift">📱</div>
    <h2 id="passTitle"></h2>
    <p class="sub" id="passSub"></p>
    <button id="passShow">Oui, c'est moi</button>
    <div id="passTarget" class="target hidden"></div>
    <button id="passNext" class="hidden">Cacher et passer au suivant →</button>
    <p><small id="passCount"></small></p>
  </div>

  <!-- Vue participant -->
  <div id="reveal" class="hidden card reveal">
    <div class="gift">🎁</div>
    <h2 id="hello"></h2>
    <button id="show">Découvrir qui tu offres</button>
    <div id="target" class="target hidden"></div>
    <small id="hint" class="hidden">Garde le secret ! 🤫</small>
  </div>
</main>

<script>
// ---------- Données initiales (modifie ici pour pré-remplir) ----------
const DEFAULT_PEOPLE = [
  { name: "Fred", partner: "" },
  { name: "alex", partner: "" },
  { name: "Jo", partner: 4 },
  { name: "sandra", partner: "" },
  { name: "dodo", partner: 2 },
  { name: "Alain", partner: 6 },
  { name: "Sylviane", partner: 5 },
  { name: "Phillipe", partner: 8 },
  { name: "Mick", partner: 7 },
  { name: "Phillipe premier du nom", partner: 10 },
  { name: "Mireille", partner: 9 },
];

const $ = id => document.getElementById(id);
let people = DEFAULT_PEOPLE.map(p => ({ ...p }));

// ---------- Rendu de la liste ----------
function renderPeople() {
  const box = $("people");
  box.innerHTML = "";
  people.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "row";
    const input = document.createElement("input");
    input.placeholder = "Prénom";
    input.value = p.name;
    input.oninput = () => { p.name = input.value; };
    input.onchange = renderPeople;
    const sel = document.createElement("select");
    sel.innerHTML = '<option value="">Pas en couple</option>';
    people.forEach((q, j) => {
      if (j !== i && q.name.trim()) {
        const o = document.createElement("option");
        o.value = j; o.textContent = "Couple avec " + q.name.trim();
        if (p.partner === j) o.selected = true;
        sel.appendChild(o);
      }
    });
    sel.onchange = () => setPartner(i, sel.value === "" ? "" : Number(sel.value));
    const del = document.createElement("button");
    del.className = "secondary del"; del.textContent = "✕";
    del.onclick = () => removePerson(i);
    row.append(input, sel, del);
    box.appendChild(row);
  });
}
function setPartner(i, j) {
  // Relation symétrique : on nettoie les anciens liens
  [i, j].forEach(k => {
    if (k !== "" && people[k].partner !== "") { people[people[k].partner].partner = ""; people[k].partner = ""; }
  });
  people[i].partner = j;
  if (j !== "") people[j].partner = i;
  renderPeople();
}
function removePerson(i) {
  if (people[i].partner !== "") people[people[i].partner].partner = "";
  people.splice(i, 1);
  people.forEach(p => { if (p.partner !== "" && p.partner > i) p.partner--; });
  renderPeople();
}
$("add").onclick = () => { people.push({ name: "", partner: "" }); renderPeople(); };

// ---------- Tirage ----------
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function doDraw(list) {
  const n = list.length;
  for (let t = 0; t < 10000; t++) {
    const perm = shuffle([...Array(n).keys()]);
    if (perm.every((r, g) => r !== g && r !== list[g].partner)) return perm;
  }
  return null;
}

$("draw").onclick = () => {
  const list = people.map(p => ({ ...p, name: p.name.trim() }));
  const err = $("error"); err.textContent = "";
  if (list.some(p => !p.name)) return err.textContent = "Il y a un prénom vide.";
  if (new Set(list.map(p => p.name.toLowerCase())).size !== list.length) return err.textContent = "Deux personnes ont le même prénom.";
  if (list.length < 3) return err.textContent = "Il faut au moins 3 personnes.";
  const perm = doDraw(list);
  if (!perm) return err.textContent = "Tirage impossible avec ces contraintes.";
  showLinks(list, perm);
};

// ---------- Liens secrets ----------
const encode = obj => btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const decode = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/")))));
const baseUrl = () => location.href.split("#")[0];

let messages = [];
let lastDraw = null, passIndex = 0;

function showPass() {
  const { list, perm } = lastDraw;
  $("results").classList.add("hidden");
  $("pass").classList.remove("hidden");
  $("passTarget").classList.add("hidden");
  $("passNext").classList.add("hidden");
  if (passIndex >= list.length) {
    $("passTitle").textContent = "C'est fini ! 🎄";
    $("passSub").textContent = "Tout le monde a son résultat. Joyeux Noël !";
    $("passShow").classList.add("hidden");
    $("passCount").textContent = "";
    return;
  }
  $("passShow").classList.remove("hidden");
  $("passTitle").textContent = "Au tour de " + list[passIndex].name;
  $("passSub").textContent = "Les autres, ne regardez pas !";
  $("passShow").textContent = "Oui, c'est moi (" + list[passIndex].name + ")";
  $("passCount").textContent = (passIndex + 1) + " / " + list.length;
}
$("phone").onclick = () => { passIndex = 0; showPass(); };
$("passShow").onclick = () => {
  const { list, perm } = lastDraw;
  $("passShow").classList.add("hidden");
  $("passSub").textContent = "Tu offres un cadeau à :";
  $("passTarget").textContent = "🎁 " + list[perm[passIndex]].name;
  $("passTarget").classList.remove("hidden");
  $("passNext").classList.remove("hidden");
  $("passNext").textContent = passIndex === list.length - 1 ? "Terminer" : "Cacher et passer au suivant →";
};
$("passNext").onclick = () => { passIndex++; showPass(); };

function showLinks(list, perm) {
  lastDraw = { list, perm };
  $("setup").classList.add("hidden");
  $("results").classList.remove("hidden");
  const box = $("links"); box.innerHTML = ""; messages = [];
  list.forEach((p, i) => {
    const link = baseUrl() + "#" + encode({ f: p.name, t: list[perm[i]].name });
    const msg = `🎅 Salut ${p.name} ! Voici ton lien Secret Santa (ne le partage pas) : ${link}`;
    messages.push(msg);
    const row = document.createElement("div"); row.className = "link-row";
    const label = document.createElement("span"); label.textContent = p.name;
    const btns = document.createElement("span");
    const copy = document.createElement("button"); copy.className = "secondary"; copy.textContent = "Copier";
    copy.onclick = async () => { await navigator.clipboard.writeText(msg); copy.textContent = "✓ Copié"; setTimeout(() => copy.textContent = "Copier", 1500); };
    const wa = document.createElement("a"); wa.href = "https://wa.me/?text=" + encodeURIComponent(msg); wa.target = "_blank";
    const waBtn = document.createElement("button"); waBtn.textContent = "WhatsApp"; waBtn.style.marginLeft = "6px"; wa.appendChild(waBtn);
    btns.append(copy, wa);
    row.append(label, btns); box.appendChild(row);
  });
}
$("copyall").onclick = async () => { await navigator.clipboard.writeText(messages.join("\n\n")); $("copyall").textContent = "✓ Copié"; };
$("back").onclick = () => { $("results").classList.add("hidden"); $("setup").classList.remove("hidden"); $("copyall").textContent = "Copier tous les messages (à découper)"; };

// ---------- Vue participant ----------
function init() {
  const h = location.hash.slice(1);
  if (h) {
    try {
      const d = decode(h);
      $("setup").classList.add("hidden");
      $("reveal").classList.remove("hidden");
      $("hello").textContent = "Salut " + d.f + " !";
      $("show").onclick = () => {
        $("show").classList.add("hidden");
        $("target").textContent = "🎁 " + d.t;
        $("target").classList.remove("hidden");
        $("hint").classList.remove("hidden");
      };
      return;
    } catch (e) { /* lien invalide : on affiche l'écran organisateur */ }
  }
  renderPeople();
}
init();
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
